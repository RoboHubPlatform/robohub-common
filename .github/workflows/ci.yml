name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # The toolchain. This module is built and tested by rho, not by cmake typed
      # into a workflow: `rho test` is the one way the host tests are run, so what
      # runs here is what a person runs.
      - name: Check out the toolchain
        uses: actions/checkout@v5
        with:
          repository: RoboHubPlatform/rho
          path: toolchain

      - name: Install the toolchain
        # check.sh builds the toolchain and publishes the modules named into the
        # local registry: the test runner and the plugins `rho test` needs here.
        run: |
          cd toolchain
          ./scripts/check.sh publish rho-test rho-test-ctest rho-test-junit
          echo "$HOME/.rho/bin" >> "$GITHUB_PATH"

      # A path under someone's home is true for one machine and published to all:
      # a manifest names a sibling by ${ROBOHUB_WORKSPACE}.
      - name: No local paths
        run: toolchain/scripts/check-local-paths.sh .

      # tests/tests.yml declares the suite. The ctest kind configures with the
      # host tests switched on (they are guarded by RHO_BUILD_HOST_TESTS, and a
      # guarded-out test is a test that does not run), builds, runs, and fails a
      # run that found no tests — "no tests were found" is a pass as far as
      # ctest's exit status goes, and only one of the two is a check.
      - name: Test
        run: rho test .
