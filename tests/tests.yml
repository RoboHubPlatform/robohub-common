# robohub-common's tests, declared.
#
# The host tests of the interfaces: ordinary portable C, registered with CMake and
# run on the machine doing the build. `rho test` is how they are run — the ctest
# kind configures, builds and runs them, and fails a run that found none.
name: robohub-common
suites:
  # test_error.c, test_registry.c, test_platform.c, test_net_defaults.c,
  # test_net_posix.c, test_keystore.c, test_keystore_default.c, test_health.c
  # test_health_default.c and test_update_slot_default.c.
  # @verifies COMM-0002, COMM-0003, COMM-0004, COMM-0005, COMM-0006, COMM-0007, COMM-0010, COMM-0011, COMM-0012, COMM-0013
  - name: unit
    kind: ctest
    tags: [unit, host]
    ctest: {}
